<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Chatbot Ademicon | Atendimento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

/* Overlay escuro */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9998;
}

/* Chat central */
#chat-widget {
  width: 360px;
  max-width: 95%;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
  overflow: hidden;
  z-index: 9999;
}

.chat-header {
  background:#c00000;
  color:#fff;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.chat-body {
  padding:15px;
  height:360px;
  overflow-y:auto;
}

.bot, .user {
  padding:10px 14px;
  border-radius:14px;
  margin-bottom:10px;
  max-width:80%;
  font-size:14px;
}

.bot {
  background:#f1f1f1;
  color:#000;
}

.user {
  background:#c00000;
  color:#fff;
  margin-left:auto;
}

.buttons {
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}

button {
  padding:10px;
  border:none;
  border-radius:10px;
  background:#000;
  color:#fff;
  cursor:pointer;
}

button:hover { background:#c00000; }
.whatsapp-btn { background:#25D366; }

input, select {
  width:100%;
  padding:8px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="overlay">
  <div id="chat-widget">
    <div class="chat-header">🤖 Atendimento Ademicon</div>
    <div class="chat-body" id="chat">
      <div class="bot">
        Olá! 👋 Posso simular seu crédito 😊
        <div class="buttons">
          <button onclick="simularImovel()">🏠 Imóvel</button>
          <button onclick="simularVeiculo()">🚗 Veículo</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const chat = document.getElementById("chat");

// TAXAS INTERNAS (OCULTAS)
const TAXA_IMOVEL = 0.242;
const TAXA_VEICULO = 0.16;

function addBot(text) {
  const d = document.createElement("div");
  d.className = "bot";
  d.innerHTML = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addUser(text) {
  const d = document.createElement("div");
  d.className = "user";
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function simularImovel() {
  addUser("Simular Imóvel");
  addBot(`
    Informe o valor do crédito:
    <input id="valorImovel" type="number" placeholder="Ex: 100000">
    Escolha o prazo (meses):
    <select id="prazoImovel">
      <option value="220">220</option>
      <option value="180">180</option>
      <option value="150">150</option>
    </select>
    <div class="buttons">
      <button onclick="calcularImovel()">Calcular</button>
    </div>
  `);
}

function calcularImovel() {
  const valor = document.getElementById("valorImovel").value;
  const prazo = document.getElementById("prazoImovel").value;
  if (!valor) return;

  const total = valor * (1 + TAXA_IMOVEL);
  const parcela = total / prazo;

  addBot(`
    📊 <b>Simulação Imóvel</b><br><br>
    Crédito: <b>R$ ${Number(valor).toLocaleString('pt-BR')}</b><br>
    Prazo: <b>${prazo} meses</b><br><br>
    💰 <b>Parcela aproximada:</b><br>
    <b>R$ ${parcela.toFixed(2)}</b><br><br>
    <button class="whatsapp-btn" onclick="whatsapp()">📲 Agendar no WhatsApp</button>
  `);
}

function simularVeiculo() {
  addUser("Simular Veículo");
  addBot(`
    Informe o valor do veículo:
    <input id="valorVeiculo" type="number" placeholder="Ex: 60000">
    Escolha o prazo (meses):
    <select id="prazoVeiculo">
      <option value="100">100</option>
      <option value="80">80</option>
      <option value="60">60</option>
    </select>
    <div class="buttons">
      <button onclick="calcularVeiculo()">Calcular</button>
    </div>
  `);
}

function calcularVeiculo() {
  const valor = document.getElementById("valorVeiculo").value;
  const prazo = document.getElementById("prazoVeiculo").value;
  if (!valor) return;

  const total = valor * (1 + TAXA_VEICULO);
  const parcela = total / prazo;

  addBot(`
    📊 <b>Simulação Veículo</b><br><br>
    Crédito: <b>R$ ${Number(valor).toLocaleString('pt-BR')}</b><br>
    Prazo: <b>${prazo} meses</b><br><br>
    💰 <b>Parcela aproximada:</b><br>
    <b>R$ ${parcela.toFixed(2)}</b><br><br>
    <button class="whatsapp-btn" onclick="whatsapp()">📲 Agendar no WhatsApp</button>
  `);
}

function whatsapp() {
  window.open("https://wa.me/5581920023267", "_blank");
}
</script>

</body>
</html>
