<script>
const msgs=document.getElementById('msgs');

let nome='',fone='',tipo='',valor=0,parcelaFinal=0;

const TAXA_IMOVEL=0.242;
const TAXA_VEICULO=0.16;

const moeda=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function bot(t){
  let d=document.createElement('div');
  d.className='bot';
  d.innerHTML=t;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function user(t){
  let d=document.createElement('div');
  d.className='user';
  d.innerText=t;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function saveName(){
  nome=document.getElementById('nome').value;
  if(!nome)return;
  user(nome);

  bot(`Qual seu WhatsApp?
  <input id="fone">
  <div class="buttons"><button onclick="saveFone()">Continuar</button></div>`);
}

function saveFone(){
  fone=document.getElementById('fone').value;
  if(!fone)return;
  user(fone);

  bot(`O que deseja simular?
  <div class="buttons">
    <button onclick="imovel()">🏠 Imóvel</button>
    <button onclick="veiculo()">🚗 Veículo</button>
  </div>`);
}

function normaliza(v){
  v=parseFloat(v);
  if(v<1000)v*=1000;
  return v;
}

function imovel(){
  tipo="Imóvel";
  user('Imóvel');

  bot(`Valor do crédito:
  <input id="vi" type="number">
  Prazo:
  <select id="pi">
    <option value="220">220</option>
    <option value="180">180</option>
  </select>
  <button onclick="calcI()">Calcular</button>`);
}

function calcI(){
  let v=normaliza(document.getElementById('vi').value);
  let p=parseInt(document.getElementById('pi').value);

  valor=v;
  parcelaFinal=(v*(1+TAXA_IMOVEL))/p;

  bot(`💰 ${moeda(parcelaFinal)}
  <button class="whatsapp" onclick="zap()">WhatsApp</button>`);
}

function veiculo(){
  tipo="Veículo";
  user('Veículo');

  bot(`Valor:
  <input id="vv" type="number">
  Prazo:
  <select id="pv">
    <option value="100">100</option>
    <option value="60">60</option>
  </select>
  <button onclick="calcV()">Calcular</button>`);
}

function calcV(){
  let v=normaliza(document.getElementById('vv').value);
  let p=parseInt(document.getElementById('pv').value);

  valor=v;
  parcelaFinal=(v*(1+TAXA_VEICULO))/p;

  bot(`💰 ${moeda(parcelaFinal)}
  <button class="whatsapp" onclick="zap()">WhatsApp</button>`);
}

function zap(){

  if(!tipo){
    alert("Selecione o tipo!");
    return;
  }

  let msg = `Olá, meu nome é ${nome}.
WhatsApp: ${fone}

Interesse: ${tipo}
Valor: ${moeda(valor)}
Parcela: ${moeda(parcelaFinal)}`;

  window.open("https://wa.me/5581920023267?text="+encodeURIComponent(msg));
}
</script>
